<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script>
<style>
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--color-border-strong) transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font-ui);caret-color:var(--color-accent)}
::selection{background:var(--color-accent-soft);color:var(--text-strong)}
a{color:var(--text-accent);text-underline-offset:2px}a:hover{color:var(--color-accent-strong-hover)}
/* Focus: a terracotta ring on anything reachable by keyboard, never removed. Inputs and
   selects draw their own ring on the wrapper (--focus-ring), so only their outline is off. */
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible,[role="dialog"]:focus-visible,[role="alertdialog"]:focus-visible{outline:none}
/* Hover and press from readme "Visual foundations": solid buttons drop to 87%, outline and
   ghost controls turn terracotta, clickable rows tint, and every pressable scales 2% on press.
   The components style inline, so hover rules need !important to win. */
@media (hover:hover) and (pointer:fine){
  button[data-variant="solid"]:not(:disabled):hover{opacity:var(--hover-opacity)}
  button[data-variant="ghost"]:not(:disabled):hover,button[data-variant="quiet"]:not(:disabled):hover{border-color:var(--color-accent)!important;color:var(--text-accent)!important}
  [data-row-action]:hover{background:var(--color-surface-2)!important}
}
button:not(:disabled):active{transform:scale(var(--press-scale))}
/* Touch: every control reaches 44px (PRODUCT "minimum 44px hit targets on touch"). Calendar
   day cells are exempt from the width floor; seven of them share a 390px row. */
@media (max-width:760px),(pointer:coarse){
  button,[role="tab"],[role="menuitem"],select,label[data-target]{min-height:var(--tap-min)!important}
  button:not([data-cell]):not([role="tab"]):not([role="menuitem"]){min-width:var(--tap-min)!important}
}
@media (prefers-reduced-motion:reduce){button:not(:disabled):active{transform:none}}
/* Celular: sem o flash cinza do toque, sem o atraso de toque duplo, sem selecionar o texto do botão
   num toque longo, e campos com 16px para o iPhone não dar zoom na página ao focar. */
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,[role="tab"],[role="menuitem"],label[data-target]{touch-action:manipulation;-webkit-user-select:none;user-select:none}
@media (pointer:coarse){input,textarea,select{font-size:16px!important}}
</style>
</head><body><div id="root"></div>
<!-- Os arquivos do admin passam por aqui em vez de <script src> direto: antes de carregar, cada um é
     conferido no servidor (fetch no-cache → 304 se não mudou), então o app instalado e o navegador pegam a
     versão nova logo depois de publicar, sem Ctrl+Shift+R. A ordem é a mesma de antes. -->
<script>
window.DLUH_VOLTAR = true; // botão voltar do celular fecha camadas em vez de sair (Modal.jsx, useVoltar)
(async () => {
  const V = "?v=20261009110320"; // tools/publicar-site.py troca por "?v=<data>" na cópia de www.dluhfestas.com/admin
  const LOCAIS = ["ds/_ds_bundle.js","data.js","contratos-data.js","data-extremos.js","api.js","firebase.js"];
  const TELAS = ["Estados.jsx","Busca.jsx","Notificacoes.jsx","Shell.jsx","VisaoGeral.jsx","Catalogo.jsx","PedidosModais.jsx","Pedidos.jsx","Boletos.jsx","Agenda.jsx","Contratos.jsx","Cartoes.jsx","Financeiro.jsx","Cozinha.jsx","Produtos.jsx","Clientes.jsx","App.jsx"];
  await Promise.all(["ds/styles.css", ...LOCAIS, ...TELAS].map(u => fetch(u + V, { cache: "no-cache" }).catch(() => {})));
  for (const u of LOCAIS) await new Promise(ok => { const s = document.createElement("script"); s.src = u + V; s.onload = s.onerror = ok; document.head.appendChild(s); });
  for (const u of TELAS) { const s = document.createElement("script"); s.type = "text/babel"; s.src = u + V; document.body.appendChild(s); }
  Babel.transformScriptTags();
})();
</script>
</body></html>
